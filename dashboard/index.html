<!DOCTYPE html>
<meta charset="utf-8">
<title>Rouge — Tripwire Cascade</title>
<style>
  :root {
    --bg:#0a0c10; --panel:#12151c; --line:#1e2430; --txt:#c9d3e0; --dim:#5b6675;
    --blue:#3b82f6; --red:#ef4444; --amber:#f59e0b; --green:#22c55e;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;
         background:var(--bg); color:var(--txt); height:100vh; overflow:hidden; }
  header { padding:10px 16px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:16px; }
  header h1 { font-size:15px; margin:0; letter-spacing:.5px; }
  header h1 .r { color:var(--red); }
  #status { font-size:12px; color:var(--dim); }
  #status.live { color:var(--green); }
  .wrap { display:grid; grid-template-columns:1fr 420px; height:calc(100vh - 45px); }
  .graph { position:relative; min-height:0; overflow:hidden; }
  /* The svg MUST carry intrinsic width/height attributes (on the tag) to
     establish a content viewport in this grid layout. CSS width/height:100%
     (or max-height:100%) leaves the box sized but paints NO geometry — the
     diagram goes blank while the feed renders fine. So size via attributes and
     only center here; never put a % height on the svg. */
  svg { display:block; margin:0 auto; }
  .node circle { transition:fill .25s, stroke .25s, r .15s; }
  .node text { fill:var(--dim); font-size:11px; text-anchor:middle; }
  .feed { border-left:1px solid var(--line); display:flex; flex-direction:column; }
  .summary { padding:12px 16px; border-bottom:1px solid var(--line);
             display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:6px;
          padding:8px 10px; }
  .stat .n { font-size:22px; font-weight:600; }
  .stat .l { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .stat.hot .n { color:var(--red); }
  .log { flex:1; overflow-y:auto; padding:8px 0; }
  .row { padding:5px 16px; border-bottom:1px solid #141821; display:flex; gap:8px;
         align-items:baseline; animation:in .2s ease; }
  @keyframes in { from{opacity:0; transform:translateY(-4px);} to{opacity:1;} }
  .row.flag { background:rgba(239,68,68,.09); }
  .row .t { color:var(--dim); font-size:11px; min-width:62px; }
  .row .a { color:var(--blue); font-weight:600; }
  .row.flag .a { color:var(--red); }
  .row .act { color:var(--amber); }
  .row .d { color:var(--txt); opacity:.8; flex:1; }
  .row .ic { min-width:14px; }
  .controls { padding:10px 16px; border-top:1px solid var(--line); font-size:12px; color:var(--dim); }
  .controls b { color:var(--txt); }
  /* view tabs */
  .vtab { font-size:12px; padding:5px 12px; border-radius:6px; cursor:pointer;
          border:1px solid var(--line); background:#12151c; color:var(--dim); }
  .vtab.on { color:#fff; border-color:var(--red); background:#1a0f14; }
  [hidden] { display:none !important; }
  /* channel (group chat) view */
  #view-channel { height:calc(100vh - 45px); }
  .chat { display:grid; grid-template-columns:1fr 260px; height:100%; }
  .chan { display:flex; flex-direction:column; min-width:0; }
  .chan .h { padding:12px 18px; border-bottom:1px solid var(--line); color:var(--dim); }
  .chan .h b { color:var(--txt); }
  .msgs { flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:11px; }
  .cm { display:flex; gap:10px; align-items:flex-start; animation:in .2s ease; }
  .cm .av { width:28px; height:28px; border-radius:7px; display:grid; place-items:center; font-size:14px;
            background:#16223a; border:1px solid #2a3c58; flex:none; }
  .cm .who { color:#9fb4d6; font-size:12px; } .cm.poison .who { color:var(--red); }
  .cm .bd { font-size:13px; } .cm.poison .bd { color:#ffb3bd; }
  .cm.sys .bd { color:var(--dim); font-style:italic; }
  .cm.sys.hot .bd { color:#ff9aa6; font-style:normal; }
  .cm.sys.frz .bd { color:#7fdcff; font-style:normal; }
  .croster { border-left:1px solid var(--line); padding:14px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  .croster .t { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  .cr { display:flex; gap:8px; align-items:center; padding:7px 9px; border-radius:8px;
        border:1px solid #1c2636; font-size:13px; transition:.3s; }
  .cr .st { margin-left:auto; font-size:10px; color:var(--green); }
  .cr.bad { border-color:#3a1620; background:#1a0e12; } .cr.bad .st { color:var(--red); }
  .cr.froze { border-color:#0d3547; } .cr.froze .st { color:#39d0ff; }
</style>

<header>
  <h1><span class="r">◆</span> ROUGE — Tripwire Cascade</h1>
  <span id="status">connecting…</span>
  <span class="vtab on" data-v="network">▚ Network</span>
  <span class="vtab" data-v="channel">💬 Channel</span>
</header>

<div id="view-network">
<div class="wrap">
  <div class="graph">
    <svg id="svg" width="900" height="700" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="feed">
    <div class="summary">
      <div class="stat"><div class="n" id="s-decoy">0</div><div class="l">Decoys touched</div></div>
      <div class="stat" id="stat-db"><div class="n" id="s-db">0</div><div class="l">DB breaches</div></div>
      <div class="stat" id="stat-inf"><div class="n" id="s-inf">0</div><div class="l">Agents infected</div></div>
      <div class="stat"><div class="n" id="s-evt">0</div><div class="l">Events</div></div>
    </div>
    <div class="log" id="log"></div>
    <div class="controls">feed: <b>live</b> · flagged events in <span style="color:var(--red)">red</span></div>
  </div>
</div>
</div>

<div id="view-channel" hidden>
  <div class="chat">
    <div class="chan">
      <div class="h"># <b>team-ops</b> · shared coordination channel</div>
      <div class="msgs" id="cmsgs"></div>
    </div>
    <div class="croster" id="croster"></div>
  </div>
</div>

<script>
const svg = document.getElementById('svg');
const SVGNS = 'http://www.w3.org/2000/svg';

// ---- fixed layout: email agent left, cascade agents in an arc, traps on the right
const nodes = {};   // id -> {x,y,el,circle,state}
function place(id, x, y, label, r=22) {
  const g = document.createElementNS(SVGNS,'g'); g.setAttribute('class','node');
  const c = document.createElementNS(SVGNS,'circle');
  c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r',r);
  c.setAttribute('fill','#1b2230'); c.setAttribute('stroke','#2b3446'); c.setAttribute('stroke-width','2');
  const t = document.createElementNS(SVGNS,'text');
  t.setAttribute('x',x); t.setAttribute('y',y+r+14); t.textContent=label;
  g.appendChild(c); g.appendChild(t); svg.appendChild(g);
  nodes[id] = {x,y,el:g,circle:c,state:'idle',r};
}

// seed known nodes
place('email_agent', 150, 350, 'email_agent', 30);
place('decoy_billing_site', 620, 180, 'wasmer decoy');
place('tenki_db', 760, 350, 'tenki trap', 26);
for (let i=1;i<=10;i++){
  const ang = (-70 + (i-1)*15) * Math.PI/180;
  place('agent_'+i, 430 + Math.cos(ang)*70, 350 + Math.sin(ang)*230, 'agent_'+i, 15);
}

// edges from email_agent to each cascade agent (drawn dim, lit on cascade)
const edges = {};
for (let i=1;i<=10;i++){
  const a = nodes['email_agent'], b = nodes['agent_'+i];
  const l = document.createElementNS(SVGNS,'line');
  l.setAttribute('x1',a.x); l.setAttribute('y1',a.y);
  l.setAttribute('x2',b.x); l.setAttribute('y2',b.y);
  l.setAttribute('stroke','#161c28'); l.setAttribute('stroke-width','1.5');
  svg.insertBefore(l, svg.firstChild);
  edges['agent_'+i]=l;
}

// nodes present at startup — on reset we keep these, drop any dynamically-added ones
const SEEDED = new Set(Object.keys(nodes));

function ensureNode(id){
  if (nodes[id]) return nodes[id];
  // unknown actor -> drop it near the bottom
  const n = Object.keys(nodes).length;
  place(id, 80 + (n%8)*95, 640, id, 14);
  return nodes[id];
}

function setState(id, state){
  const nd = ensureNode(id);
  // sticky: once infected/breached it stays red
  if (nd.state==='rogue' && state!=='rogue') return;
  nd.state = state;
  const map = {idle:'#1b2230', active:'#1e3a5f', rogue:'#3a1416'};
  const stroke = {idle:'#2b3446', active:'var(--blue)', rogue:'var(--red)'};
  nd.circle.setAttribute('fill', map[state]||map.idle);
  nd.circle.setAttribute('stroke', stroke[state]||stroke.idle);
  if (state==='active'){ // quick pulse then settle
    nd.circle.setAttribute('r', nd.r+4);
    setTimeout(()=>nd.circle.setAttribute('r', nd.r), 180);
  }
}

// ---- summary state
const seen = {decoy:new Set(), db:new Set(), inf:new Set()};
let evtCount = 0;
function updateSummary(ev){
  evtCount++;
  if (ev.action==='decoy_triggered') seen.decoy.add(ev.actor);
  if (ev.flagged && (ev.action==='attempted_login' || ev.actor==='tenki_db')) seen.db.add(ev.target||ev.actor);
  if (ev.flagged && ev.actor.startsWith('agent_')) seen.inf.add(ev.actor);
  document.getElementById('s-decoy').textContent = seen.decoy.size;
  document.getElementById('s-db').textContent = seen.db.size;
  document.getElementById('s-inf').textContent = seen.inf.size;
  document.getElementById('s-evt').textContent = evtCount;
  document.getElementById('stat-db').classList.toggle('hot', seen.db.size>0);
  document.getElementById('stat-inf').classList.toggle('hot', seen.inf.size>0);
}

// ---- log feed
const log = document.getElementById('log');
function addRow(ev){
  const row = document.createElement('div');
  row.className = 'row' + (ev.flagged?' flag':'');
  const time = (ev.time||'').slice(11,19);
  row.innerHTML =
    `<span class="ic">${ev.flagged?'🚨':'·'}</span>`+
    `<span class="t">${time}</span>`+
    `<span class="a">${ev.actor}</span>`+
    `<span class="act">${ev.action}</span>`+
    `<span class="d">${(ev.detail||ev.target||'').replace(/</g,'&lt;')}</span>`;
  log.insertBefore(row, log.firstChild);
  while (log.children.length>300) log.removeChild(log.lastChild);
}

function resetDashboard(){
  // in-place clean slate between runs — no full page reload (jarring on a projector,
  // and it drops the websocket mid-demo). Clears log, nodes, edges, counters.
  log.innerHTML = '';
  seen.decoy.clear(); seen.db.clear(); seen.inf.clear(); evtCount = 0;
  for (const id of ['s-decoy','s-db','s-inf','s-evt']) document.getElementById(id).textContent = '0';
  document.getElementById('stat-db').classList.remove('hot');
  document.getElementById('stat-inf').classList.remove('hot');
  for (const id of Object.keys(nodes)){
    if (!SEEDED.has(id)){ nodes[id].el.remove(); delete nodes[id]; continue; }
    const nd = nodes[id];
    nd.state = 'idle';
    nd.circle.setAttribute('fill', '#1b2230');
    nd.circle.setAttribute('stroke', '#2b3446');
    nd.circle.setAttribute('r', nd.r);
  }
  for (const k of Object.keys(edges)){
    edges[k].setAttribute('stroke', '#161c28');
    edges[k].setAttribute('stroke-width', '1.5');
  }
}

function handle(ev){
  if (ev.action==='reset'){ resetDashboard(); chatReset(); return; }
  addRow(ev);
  updateSummary(ev);
  // node coloring
  const rogue = ev.flagged;
  setState(ev.actor, rogue?'rogue':'active');
  if (ev.action==='decoy_triggered') setState(ev.actor,'rogue');
  // light the cascade edge when a poisoned update is read
  if (ev.action==='shared_update_read' && edges[ev.actor]){
    edges[ev.actor].setAttribute('stroke', ev.flagged?'var(--red)':'var(--blue)');
    edges[ev.actor].setAttribute('stroke-width','2.5');
  }
  chatHandle(ev);   // feed the same event to the Channel view
}

// ---- channel (group chat) view — driven by the same live events
const LABELS = {
  email_agent:['Gmail Agent','📧'], agent_1:['Finance','💰'], agent_2:['Sales','📈'],
  agent_3:['Marketing','📣'], agent_4:['Support','🎧'], agent_5:['Ops','⚙️'],
  decoy_billing_site:['Wasmer Decoy','🌐'], tenki_db:['Tenki Trap','🗄'], tripwire:['Tripwire','🛡'],
};
const lab = a => LABELS[a] ? LABELS[a][0] : a;
const ic  = a => LABELS[a] ? LABELS[a][1] : '🔹';
const ROSTER = ['email_agent','agent_1','agent_2','agent_3','agent_4','agent_5'];
const cmsgs = document.getElementById('cmsgs');
const croster = document.getElementById('croster');
let chatFlags = {};
function crosterInit(){
  croster.innerHTML = '<div class="t">Workspace</div>' + ROSTER.map(id=>
    `<div class="cr" id="cr-${id}"><span>${ic(id)}</span><span>${lab(id)}</span>`+
    `<span class="st">● ok</span></div>`).join('');
}
function crStatus(id,cls,txt){ const r=document.getElementById('cr-'+id); if(!r)return;
  r.className='cr '+cls; r.querySelector('.st').textContent=txt; }
function cmsg(actor,body,cls=''){ const d=document.createElement('div'); d.className='cm '+cls;
  d.innerHTML=`<span class="av">${ic(actor)}</span><div><div class="who">${lab(actor)}</div>`+
    `<div class="bd">${(body||'').replace(/</g,'&lt;')}</div></div>`;
  cmsgs.appendChild(d); cmsgs.scrollTop=cmsgs.scrollHeight; }
function csys(body,cls=''){ const d=document.createElement('div'); d.className='cm sys '+cls;
  d.innerHTML=`<span class="av">🔎</span><div><div class="bd">${body}</div></div>`;
  cmsgs.appendChild(d); cmsgs.scrollTop=cmsgs.scrollHeight; }
function chatReset(){ cmsgs.innerHTML=''; chatFlags={}; crosterInit(); }
// once(): only emit a given beat the first time (agents can repeat actions)
function once(k){ if(chatFlags[k]) return false; chatFlags[k]=true; return true; }
function chatHandle(ev){
  const a=ev.action, who=ev.actor;
  if(a==='read_email'){ if(once('start')) cmsg('email_agent','On it — processing the inbox…'); return; }
  if(a==='read_file'||a==='opened_folder'||a==='accessed_credential'){
    if(once('bait')) csys('Gmail Agent followed a hidden instruction → opened /shared/finance_exports and read onboarding_notes.md (found DB cred svc_billing_ro)','hot'); return; }
  if(a==='visited_url'){ if(once('visit')) csys('Gmail Agent visited the internal billing portal'); return; }
  if(a==='decoy_triggered'){ if(once('decoy')) csys('🎯 Wasmer decoy TRIPPED — a real agent never touches this (catch #1)','hot'); return; }
  if(a==='attempted_login' && who!=='tenki_db'){ if(once('login')) csys('Gmail Agent submitted the planted DB cred (catch #2)','hot'); return; }
  if(a==='trap_triggered'||(a==='reasoning'&&who==='tenki_db'&&ev.flagged)){
    if(once('breach')) csys('🗄 Tenki spun up a real disposable fake DB — breach confirmed','hot'); return; }
  if(a==='db_query'){ if(once('exfil')) csys('Gmail Agent queried the fake DB → exfiltrated customer records','hot'); return; }
  if(a==='shared_update_posted'){ cmsg(who, ev.detail||'posted an update to the shared log','poison'); crStatus(who,'bad','● compromised'); return; }
  if(a==='shared_update_read' && ev.flagged){ cmsg(who,'Thanks! Pulling the current figures from onboarding_notes now…','poison'); crStatus(who,'bad','● compromised'); return; }
  if(a==='contained'||a==='freeze'||a==='blocked'){
    if(once('freeze')) csys('🛡 Tripwire froze the agent — the poisoned note never reached the channel','frz');
    crStatus(LABELS[ev.target]?ev.target:'email_agent','froze','● frozen'); return; }
}
crosterInit();

// ---- view tabs
function showView(v){
  document.getElementById('view-network').hidden = (v!=='network');
  document.getElementById('view-channel').hidden = (v!=='channel');
  document.querySelectorAll('.vtab').forEach(t=>t.classList.toggle('on', t.dataset.v===v));
}
document.querySelectorAll('.vtab').forEach(t=>t.onclick=()=>showView(t.dataset.v));
if(new URLSearchParams(location.search).get('view')==='channel') showView('channel');

// ---- websocket
const status = document.getElementById('status');
function connect(){
  const proto = location.protocol==='https:'?'wss':'ws';
  const ws = new WebSocket(`${proto}://${location.host}/stream`);
  ws.onopen = ()=>{ status.textContent='● live'; status.className='live'; };
  ws.onclose = ()=>{ status.textContent='reconnecting…'; status.className=''; setTimeout(connect,1200); };
  ws.onmessage = (m)=>{ try{ handle(JSON.parse(m.data)); }catch(e){} };
}
connect();
</script>
